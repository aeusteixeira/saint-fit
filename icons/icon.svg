<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Saint Fit">
  <defs>
    <linearGradient id="sf-bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="55%" stop-color="#7B2FBE"/>
      <stop offset="100%" stop-color="#3F1366"/>
    </linearGradient>
    <linearGradient id="sf-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4E8FF"/>
      <stop offset="100%" stop-color="#D9BFFF"/>
    </linearGradient>
    <radialGradient id="sf-glow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="sf-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#sf-bg)"/>

  <!-- Concentric rings (energia/níveis) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>

  <!-- Top-left highlight -->
  <rect width="512" height="512" rx="112" fill="url(#sf-glow)"/>

  <!-- Dumbbell horizontal centralizado -->
  <g filter="url(#sf-drop)" fill="url(#sf-metal)">
    <!-- Cap externo esquerdo -->
    <rect x="56" y="220" width="32" height="72" rx="10"/>
    <!-- Placa interna esquerda -->
    <rect x="92" y="172" width="84" height="168" rx="22"/>
    <!-- Barra -->
    <rect x="176" y="244" width="160" height="24" rx="8"/>
    <!-- Placa interna direita -->
    <rect x="336" y="172" width="84" height="168" rx="22"/>
    <!-- Cap externo direito -->
    <rect x="424" y="220" width="32" height="72" rx="10"/>
  </g>

  <!-- Estrias de pegada na barra -->
  <g fill="rgba(63,19,102,0.55)">
    <rect x="234" y="248" width="2.5" height="16" rx="1"/>
    <rect x="244" y="248" width="2.5" height="16" rx="1"/>
    <rect x="254" y="248" width="2.5" height="16" rx="1"/>
    <rect x="264" y="248" width="2.5" height="16" rx="1"/>
    <rect x="274" y="248" width="2.5" height="16" rx="1"/>
  </g>

  <!-- Spark / accent sparkle no canto -->
  <g fill="#FFD93D" opacity="0.9">
    <path d="M388 92 L394 108 L410 114 L394 120 L388 136 L382 120 L366 114 L382 108 Z"/>
  </g>
</svg>
