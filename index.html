<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Primary meta -->
  <title>Saint Fit — Treino de academia com plano ABC e progresso</title>
  <meta name="description" content="Saint Fit é um PWA gratuito de treino com plano ABC personalizado, XP, streak e vídeos de execução em português. Funciona offline, instala na tela inicial." />
  <meta name="keywords" content="treino, academia, PWA, plano ABC, hipertrofia, condicionamento, exercícios, fitness, treino em casa, app de treino" />
  <meta name="author" content="Matheus Teixeira" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://saint-fit.vercel.app/" />

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Saint Fit" />
  <meta property="og:title" content="Saint Fit — Treino ABC, XP, streak e vídeos de execução" />
  <meta property="og:description" content="PWA gratuito pra organizar seu treino. Plano ABC adaptado a limitações físicas, vídeos em português, funciona offline." />
  <meta property="og:url" content="https://saint-fit.vercel.app/" />
  <meta property="og:image" content="https://saint-fit.vercel.app/assets/og-banner.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Saint Fit — PWA de treino com plano ABC" />
  <meta property="og:locale" content="pt_BR" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Saint Fit — Treino ABC com XP e vídeos" />
  <meta name="twitter:description" content="PWA gratuito pra organizar seu treino. Plano ABC adaptado, vídeos em português, offline-first." />
  <meta name="twitter:image" content="https://saint-fit.vercel.app/assets/og-banner.png" />
  <meta name="twitter:image:alt" content="Saint Fit — PWA de treino" />

  <!-- PWA / Mobile -->
  <meta name="theme-color" content="#7B2FBE" />
  <meta name="application-name" content="Saint Fit" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Saint Fit" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
  <link rel="mask-icon" href="./icons/icon.svg" color="#7B2FBE" />
  <!-- iOS Safari precisa de PNG — SVG não funciona em apple-touch-icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />

  <!-- Structured data (Schema.org — WebApplication) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Saint Fit",
    "description": "PWA de treino com plano ABC personalizado, XP, streak e vídeos de execução em português.",
    "url": "https://saint-fit.vercel.app/",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" },
    "inLanguage": "pt-BR"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/screens.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <main id="view" class="view" aria-live="polite"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegação principal"></nav>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
